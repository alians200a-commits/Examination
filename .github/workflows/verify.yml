name: Verify AlMufeed v14
on:
  push:
    branches: [main, 'feature/**', 'replace/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the standalone project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 38 core and mathematical checks
        run: node tests/unit.js
      - name: Build self-contained standalone HTML
        run: |
          node build.js
          node --check app.js
          cp index.html /tmp/almufeed-built.html
          node build.js
          cmp /tmp/almufeed-built.html index.html
      - name: Install Playwright and Chromium for real browser/PDF checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq poppler-utils
      - name: Test mobile workflow, desktop, grades and exact A4 PDF pagination
        run: node tests/v14-ux.js
      - name: Attach visual and PDF test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: almufeed-v14-browser-evidence
          path: |
            tests/v14-*.png
            tests/v14-ux-results.json
            tests/v14-*.pdf
          if-no-files-found: ignore
      - name: Commit generated index.html and app.js after validation
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          if ! git diff --cached --quiet; then
            git commit -m "Build verified AlMufeed v14 standalone app"
            git push
          fi

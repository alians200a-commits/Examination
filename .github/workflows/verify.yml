name: Verify AlMufeed v13
on:
  push:
    branches: [main, 'replace/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check mathematical and content functions
        run: node tests/unit.js
      - name: Verify standalone HTML builds byte-for-byte
        run: |
          cp index.html /tmp/almufeed-before.html
          node build.js
          cmp /tmp/almufeed-before.html index.html
          node --check app.js
      - name: Install headless browser for original test suite
        run: |
          npm init -y >/dev/null
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual browser workflows and print layout
        run: |
          node tests/browser.js
          node tests/layout.js
          node tests/extended.js
          node tests/pagination.js
          node tests/entry.js

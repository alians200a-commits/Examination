name: Import AlMufeed v13 verified archive
on:
  push:
    branches: [replace/almufeed-v13]
permissions:
  contents: write
jobs:
  import-clean-project:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify the exact user archive
        env:
          ARCHIVE_URL: https://t1100360000020029.p.clickup-attachments.com/t1100360000020029/23579303-c10d-4e2b-8f77-20ce1a63a06d/almufeed-v13.zip
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 120 "$ARCHIVE_URL" -o /tmp/almufeed-v13.zip
          echo 'd33a6589ab82482bf14bdfe778a835086644b3179d923188780d446c879cac7c  /tmp/almufeed-v13.zip' | sha256sum -c -
          mkdir -p /tmp/almufeed-import
          unzip -q /tmp/almufeed-v13.zip -d /tmp/almufeed-import
          test -f /tmp/almufeed-import/almufeed/index.html
          test -f /tmp/almufeed-import/almufeed/build.js
      - name: Test original sources without modification
        run: |
          set -euo pipefail
          cd /tmp/almufeed-import/almufeed
          node tests/unit.js
          cp index.html /tmp/almufeed-original.html
          node build.js
          cmp /tmp/almufeed-original.html index.html
          node --check app.js
      - name: Replace the old repository tree completely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet -- . || true
          cp -a /tmp/almufeed-import/almufeed/. "$GITHUB_WORKSPACE/"
          rm -f app.js
          printf '/node_modules/\n/app.js\n*.log\n.DS_Store\n' > .gitignore
          git add -A
          git commit -m "Replace entire Examination application with verified AlMufeed v13"
          git push origin HEAD:replace/almufeed-v13

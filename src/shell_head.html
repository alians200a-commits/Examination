<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F5F9">
<title>المفيد في تنضيد الامتحانات</title>
<style>
/* EMBEDDED_FONTS */
:root{
 --bg:oklch(0.975 0.004 255);--panel:oklch(0.995 0.002 255);--sunk:oklch(0.962 0.006 255);
 --ink:oklch(0.27 0.03 262);--ink2:oklch(0.45 0.025 262);--muted:oklch(0.58 0.02 262);
 --line:oklch(0.91 0.008 262);--line2:oklch(0.945 0.006 262);
 --acc:oklch(0.45 0.11 262);--acc-h:oklch(0.40 0.11 262);--acc-soft:oklch(0.955 0.018 262);--acc-line:oklch(0.83 0.05 262);
 --danger:oklch(0.55 0.17 27);--danger-soft:oklch(0.965 0.02 27);--ok:#456B9D;--warn:#946180;
 --r:14px;--r-sm:10px;--e-out:cubic-bezier(0.22,1,0.36,1);
 --sh-1:0 1px 2px oklch(0.35 0.03 262 / .06);--sh-2:0 12px 32px -14px oklch(0.35 0.03 262 / .28);
 --nav-h:64px;--top-h:58px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;max-width:100%;overflow-x:hidden;direction:rtl}
.app,.wizard,#eqdlg,#sympop{direction:rtl;text-align:right}
body{font-family:'Cairo',system-ui,sans-serif;font-size:15px;line-height:1.6;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.wz-open{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}

/* ---------- الهيكل (الهاتف أولاً) ---------- */
.app{display:grid;grid-template-rows:var(--top-h) auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100dvh;width:100%;overflow:hidden}
.ico{flex:none;display:block}
.top{display:flex;align-items:center;gap:6px;padding:0 10px;min-width:0;overflow:hidden;padding-top:env(safe-area-inset-top);background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--acc);color:var(--panel);display:grid;place-items:center;flex:none;font-weight:800;font-size:18px}
.brand b{display:block;font-size:15px;font-weight:800;line-height:1.25;white-space:nowrap}
.brand small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;white-space:nowrap}
.brand>div{min-width:0;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--sunk)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--panel)}.btn.primary:hover:not(:disabled){background:var(--acc-h)}
.btn.soft{background:var(--acc-soft);border-color:transparent;color:var(--acc)}.btn.soft:hover{background:oklch(0.93 0.03 262)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px}
.btn.danger-t{border-color:transparent;background:none;color:var(--danger)}.btn.danger-t:hover{background:var(--danger-soft)}
.ib{width:42px;height:42px;display:inline-grid;place-items:center;border:0;border-radius:var(--r-sm);background:none;color:var(--ink2);flex:none;transition:background .12s,color .12s}
.ib:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.ib.on{background:var(--acc-soft);color:var(--acc)}
.ib.danger:hover:not(:disabled){background:var(--danger-soft);color:var(--danger)}
.top .undo{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r-sm);padding:1px}
.top .undo .ib{width:40px;height:38px}
.menu{position:relative}.menu>summary{list-style:none}.menu>summary::-webkit-details-marker{display:none}
.menu-m{position:fixed;inset-inline-end:12px;top:calc(var(--top-h) + 4px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);padding:6px;min-width:220px;max-width:calc(100vw - 24px);z-index:40}
.menu-m button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:11px 12px;border-radius:9px;text-align:start;font-size:14.5px;font-weight:600}
.menu-m button:hover{background:var(--sunk)}
.status{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;margin-inline:4px}
.status[data-s=saving]{background:var(--warn)}.status[data-s=error]{background:var(--danger)}
.main{position:relative;min-height:0;min-width:0;overflow:hidden}
.side{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.stabs{display:none}
.sbody{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.pad{padding:14px 14px 24px;max-width:720px;width:100%;min-width:0;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.canvas{position:absolute;inset:0;overflow:auto;background:oklch(0.94 0.006 262);visibility:hidden;pointer-events:none;padding-bottom:calc(var(--nav-h) + 16px)}
.app[data-view=preview] .canvas{visibility:visible;pointer-events:auto}
.canvas,.side{direction:rtl}
.app[data-view=preview] .side{visibility:hidden}
.nav{position:fixed;direction:rtl;inset-inline:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--panel);border-top:1px solid var(--line)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.nav button[aria-current=true]{color:var(--acc)}
.nav button[aria-current=true] .ico{background:var(--acc-soft);border-radius:99px;padding:3px 14px;box-sizing:content-box}

/* ---------- شريط الأدوات: صف واحد مثل شريط وورد ---------- */
.ribbon{display:flex;align-items:center;gap:4px;padding:5px 10px;min-width:0;overflow-x:auto;scrollbar-width:none;background:var(--panel);border-bottom:1px solid var(--line)}
.ribbon::-webkit-scrollbar{display:none}
.rb{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;height:36px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink2);font-size:13.5px;font-weight:700}
.rb b,.rb u{font-family:'Times New Roman',Tinos,serif;font-size:17px}
.rb:hover{background:var(--sunk);color:var(--ink)}
.rb:active{background:var(--acc-soft);color:var(--acc)}
.rsep{flex:none;width:1px;height:22px;background:var(--line);margin:0 4px}
.rhint{flex:none;margin-inline-start:auto;font-size:12px;color:var(--muted);padding-inline-start:10px;white-space:nowrap}
@media (max-width:560px){.rhint{display:none}.rb.wide span{display:none}.rb.wide{min-width:42px}}

/* ---------- الحقل الغني: معادلات داخل السطر ---------- */
.rte{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);padding:9px 12px;font-family:'Noto Sans Arabic','Cairo',sans-serif;font-size:15.5px;line-height:1.9;outline:none;overflow-wrap:anywhere;white-space:pre-wrap;transition:border-color .15s,box-shadow .15s;cursor:text}
.rte:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.rte.ph-on::before{content:attr(data-ph);color:oklch(0.7 0.015 262);pointer-events:none}
.rte.th{background:var(--sunk);font-weight:700}
.eqc{display:inline-block;white-space:nowrap;padding:0 .2em;margin:0 .05em;border-radius:6px;cursor:pointer;vertical-align:middle;line-height:1.5}
.rte .eqc{background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc-line)}
.rte .eqc:hover{background:oklch(0.93 0.035 262)}
#pages .eqc{padding:0;margin:0;border-radius:2px;line-height:inherit}
#pages [contenteditable] .eqc:hover{box-shadow:0 0 0 1px oklch(0.78 0.08 262)}
.chs{display:flex;flex-direction:column;gap:6px;padding-inline-start:40px}
.chr{display:flex;align-items:center;gap:6px}
.chr .rte{min-height:40px;padding:6px 10px;font-size:15px}
.chn{flex:none;width:24px;text-align:center;font-weight:800;color:var(--acc);font-size:14px}
.ib.sm{width:36px;height:36px}
.ghost.sm{min-height:38px;font-size:13px;border-width:1px}
.mrow{display:flex;align-items:flex-start;gap:6px}
.mrow .rte{flex:1 1 0}
.mlink{flex:none;color:var(--muted);padding-top:12px}
.mrow-a{display:flex;justify-content:flex-end}
.item.mi{gap:4px;padding:8px}
.tbed{display:flex;flex-direction:column;gap:8px}
/* The same selected row and column remain visible on narrow mobile screens. */
.tbed-scroll{max-width:100%;overflow:auto;overscroll-behavior-x:contain;border:1px solid var(--line);border-radius:12px;background:#FFF}
.tbed-g{display:grid;grid-template-columns:38px repeat(var(--tc),minmax(110px,1fr));gap:3px;min-width:max-content;padding:7px;align-items:stretch;direction:rtl}
.tbed-g .rte{display:block;width:100%;height:100%;min-height:42px;padding:8px 9px;font-size:14px;text-align:center;border:1px solid transparent;border-radius:7px;background:transparent}
.tbed-corner,.tbed-col-head,.tbed-row-head{display:grid;place-items:center;background:#EAF0F8;color:#344F72;font-weight:800;font-size:12px;border-radius:7px}
.tbed-corner{font-size:9px;text-align:center;padding:2px;line-height:1.4}
.tbed-cell{min-width:0;border:1px solid #E3EAF3;border-radius:8px;background:#FFF;transition:background .15s,border-color .15s}
.tbed-cell.table-heading-cell{background:#F1F5FB;border-color:#D7E1EF}
.tbed-cell.current,.tbed-cell:focus-within{border-color:#527DB2;background:#EAF2FD;box-shadow:0 0 0 2px rgba(77,119,177,.13)}
.tbed-cell .rte:focus{box-shadow:none;border:0;background:transparent}
.tbed-a{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tbed-a .tb{display:inline-flex;align-items:center;gap:4px;padding:0 10px;font-size:13px;width:auto}
.table-edit-more{border-top:1px solid var(--line);padding-top:8px}
.table-edit-more>summary{cursor:pointer;color:var(--ink2);font-size:13px;font-weight:700;min-height:36px}
.table-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tbadd{align-self:flex-start}
.fld.wide{flex-basis:100%}
.fld .seg{margin-bottom:4px}
.fld .seg small{font-family:'Noto Sans Arabic',serif;opacity:.7;margin-inline-start:2px}
/* ورقة الرموز السريعة */
#sympop{position:fixed;z-index:65;inset-inline:0;bottom:0;max-height:52dvh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -14px 30px -18px oklch(0.35 0.03 262 / .35);border-radius:18px 18px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;animation:sheet .25s var(--e-out)}
#sympop .sp-h{display:flex;align-items:center;gap:8px;min-width:0}
#sympop .sp-h b{flex:none;font-size:15px}
#sympop .symtabs{flex:1;min-width:0}
/* معرض صيغ المعادلات مجمّعة */
.eqgal{display:flex;flex-direction:column;gap:10px}
.gal-g{display:flex;flex-direction:column;gap:6px}
.gal-h{font-size:12px;font-weight:800;color:var(--muted)}
.eqtemplates>summary{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:4px 0;cursor:pointer;font-size:14px;font-weight:700;list-style:none}
.eqtemplates>summary::-webkit-details-marker{display:none}
.eqtemplates[open]>summary>svg{transform:rotate(180deg)}

/* ---------- عناصر النماذج ---------- */
.sub-h{font-size:13px;font-weight:700;color:var(--ink2)}
.fld{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.fld>span{font-size:12.5px;font-weight:700;color:var(--ink2)}
.fld.xs{flex:0 0 92px}.fld.sm{flex:0 0 160px}
input:not([type=checkbox]):not([type=range]),textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);padding:9px 12px;font-size:15.5px;line-height:1.6;resize:none;transition:border-color .15s,box-shadow .15s}
input:not([type=checkbox]):not([type=range]):focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
::placeholder{color:oklch(0.7 0.015 262)}
.row{display:flex;gap:10px;align-items:flex-start}.row.wrap{flex-wrap:wrap}.row.al-end{align-items:flex-end;flex-wrap:wrap}
.seg{display:flex;background:var(--sunk);border-radius:var(--r-sm);padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;min-height:36px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--acc);box-shadow:var(--sh-1)}
.seg.big button{min-height:44px;font-size:15px}.seg.sm button{min-height:34px;font-size:13px;padding:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:0 16px;font-size:14.5px;font-weight:700;transition:border-color .15s,background .15s,color .15s}
.chip:hover{border-color:var(--acc-line)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--panel)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;min-height:42px}
.chk input{width:19px;height:19px;accent-color:var(--acc);margin:0}
.opt{display:flex;flex-direction:column;gap:6px}.opt>span{font-size:12.5px;font-weight:700;color:var(--ink2)}
.hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.7}
.ghost{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;border:1.5px dashed var(--line);background:none;border-radius:var(--r-sm);font-weight:700;font-size:14px;color:var(--ink2)}
.ghost:hover{border-color:var(--acc-line);color:var(--acc);background:var(--acc-soft)}
.rng{display:flex;flex-direction:column;gap:0;font-size:12.5px;font-weight:700;color:var(--ink2);flex:1;min-width:130px}
.rng input{accent-color:var(--acc);width:100%;height:30px}
.sp{flex:1}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:36px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--ink2)}
.empty svg{color:var(--muted);margin-bottom:6px}.empty span{font-size:13.5px;color:var(--muted)}

/* أقسام قابلة للطي */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:800;font-size:15px;min-height:54px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary>svg:first-child{color:var(--acc)}
.sec>summary span{flex:1}
.sec>summary>svg:last-child{color:var(--muted);transition:transform .2s var(--e-out)}
.sec[open]>summary>svg:last-child{transform:rotate(180deg)}
.sec-b{padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px}
.sec.in{background:var(--sunk);border-color:var(--line2)}
.sec.in>summary{min-height:46px;padding:10px 14px;font-size:14px}
.sec.in .sec-b{padding:0 14px 14px}

/* ---------- الأسئلة ---------- */
.addsheet{display:grid;grid-template-columns:1fr 1fr;gap:8px;animation:rise .25s var(--e-out)}
.kind{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:start;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:12px 14px;min-height:64px}
.kind:hover{border-color:var(--acc-line);background:var(--acc-soft)}
.kind b{font-size:14.5px}.kind small{font-size:12px;color:var(--muted);line-height:1.5}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}}
.qlist,.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qlist{gap:10px}
.qc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,box-shadow .2s}
.qc.open{border-color:var(--acc-line);box-shadow:0 0 0 4px var(--acc-soft)}
.qc-h{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;min-height:60px;text-align:start;border-radius:var(--r)}
.qbadge{flex:none;min-width:44px;height:30px;padding:0 8px;border-radius:9px;background:var(--acc-soft);color:var(--acc);font-weight:800;font-size:14px;display:grid;place-items:center}
.qc-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:15px}
.qc-s{flex:none;font-size:12.5px;font-weight:700;color:var(--danger);background:var(--danger-soft);border-radius:99px;padding:2px 10px}
.qc-h>svg{flex:none;color:var(--muted)}
.qed{padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line2);animation:rise .25s var(--e-out)}
.qed>.fld:first-child{margin-top:10px}
.items{gap:8px}
.item{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:var(--r-sm);background:var(--sunk)}
.item-r{display:flex;gap:8px;align-items:flex-start}
.ibadge{flex:none;min-width:32px;height:32px;padding:0 4px;margin-top:6px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:13.5px;font-weight:800;display:grid;place-items:center;color:var(--ink2)}
.item-r textarea{flex:1}
.iact{display:flex;flex-wrap:wrap;gap:6px;padding-inline-start:40px}
.tag{display:inline-flex;align-items:center;gap:5px;min-height:34px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:0 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.tag:hover,.tag.on{border-color:var(--acc-line);color:var(--acc);background:var(--acc-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.symtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.symtabs::-webkit-scrollbar{display:none}
.symtabs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;min-height:34px;padding:0 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.symtabs button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--panel)}
.tprev{padding:8px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line2);font-family:'Noto Sans Arabic',sans-serif;font-size:16px;line-height:2.1;overflow-x:auto}
.eqchips{display:flex;flex-wrap:wrap;gap:6px}
.eqchip{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--acc-soft);color:var(--acc);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.drawer{display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:9px;background:var(--panel);border:1px solid var(--line2)}
.tools{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;margin-inline-start:auto}
.tb{min-width:40px;height:40px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-weight:700;color:var(--ink2)}
.tb:hover:not(:disabled){border-color:var(--acc-line);color:var(--acc)}.tb.danger:hover:not(:disabled){color:var(--danger);border-color:var(--danger)}
.imgctl{display:flex;gap:10px;align-items:center;padding:8px;border-radius:9px;background:var(--panel);border:1px solid var(--line2)}
.imgctl>img{width:60px;height:60px;object-fit:contain;border-radius:7px;background:var(--sunk);flex:none}
.imgctl-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.imgctl .row{flex-wrap:wrap;align-items:center}
.qfoot{display:flex;align-items:center;gap:2px;padding-top:6px;border-top:1px solid var(--line2)}

/* ---------- الورقة ---------- */
.summary{display:flex;flex-wrap:wrap;gap:6px}
.summary span{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.frow{display:flex;gap:8px;align-items:flex-start}
.frow-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.frow-l{font-size:12.5px;font-weight:700;color:var(--ink2)}
.frow.off .frow-b{opacity:.45}
.eye{flex:none;width:42px;height:42px;margin-top:22px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel);color:var(--acc);display:grid;place-items:center}
.eye[aria-pressed=false]{color:var(--muted);background:var(--sunk);border-style:dashed}
.pair{display:flex;gap:6px;align-items:flex-start}.pair .lb{flex:0 0 108px}
.logo-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo-row img{width:46px;height:46px;object-fit:contain;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--panel)}

/* ---------- التنسيق ---------- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.theme{display:flex;align-items:center;gap:10px;min-width:0;min-height:52px;font-size:14px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:10px 12px;text-align:start;color:var(--ink)}
.theme[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.theme b{display:block;font-size:14px}.theme small{display:block;font-size:12px;color:var(--muted)}
.sw{display:flex;flex-direction:column;gap:3px;width:30px;flex:none}.sw span{height:7px;border-radius:4px}.sw span:nth-child(2){width:60%}
.fonts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.fonts button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:10px 6px;min-height:66px}
.fonts button span{font-size:18px;line-height:1.5}
.fonts button small{font-size:12px;color:var(--muted)}
.fonts button[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}

/* ---------- المعاينة ---------- */
.cbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 14px;background:oklch(0.94 0.006 262);font-size:13px;color:var(--ink2)}
.cbar .warn{color:var(--danger);font-weight:700}
.zoom{margin-inline-start:auto;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px}
.zoom .ib{width:36px;height:34px}
#zval{min-width:52px;border:0;background:none;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;height:34px}
#zoomer{padding:4px 10px 40px;margin-inline:auto;width:max-content}
.page .qb.sel{box-shadow:0 0 0 2px oklch(0.75 0.09 262)}
#pages [contenteditable]{outline:none;border-radius:2px}
#pages [contenteditable]:hover{background:rgba(237,244,251,.8)}
#pages [contenteditable]:focus{background:#EDF4FB;box-shadow:0 0 0 1.5px #86A5CD}
#pages [contenteditable]:empty::before{content:attr(data-ph);color:#9aa1ad}
.too-tall,.too-wide{outline:2px dashed oklch(0.55 0.17 27);outline-offset:1mm}
.eq-error{color:var(--danger);background:var(--danger-soft);margin:0;padding:8px 12px;border-radius:8px;font-size:14px}
.math-error{color:var(--danger);text-decoration:underline wavy}
.empty-paper{margin:auto;color:#8a92a0;font-family:'Cairo',sans-serif;font-size:11pt}

/* ---------- المعالج ---------- */
.wizard{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:flex;align-items:flex-start;justify-content:center}
.wz-card{width:100%;min-height:100dvh;background:var(--panel);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wz-top{display:flex;align-items:center;gap:10px;padding:14px 18px}
.wz-top b{flex:1;font-size:15px}
.wz-steps{display:flex;gap:6px;padding:0 18px 6px}
.wz-steps span{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.wz-steps span::before{content:'';height:4px;border-radius:4px;background:var(--line)}
.wz-steps span.cur,.wz-steps span.done{color:var(--acc)}
.wz-steps span.cur::before,.wz-steps span.done::before{background:var(--acc)}
.wz-steps i{display:none}
.wz-body{flex:1;padding:18px 18px 24px;display:flex;flex-direction:column;gap:14px}
.wz-body h2{font-size:22px}
.lead{margin:-8px 0 4px;color:var(--muted);font-size:14px}
.stagecards{display:flex;flex-direction:column;gap:10px}
.stagecard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:1.5px solid var(--line);background:var(--panel);border-radius:var(--r);padding:18px 20px;min-height:84px;transition:border-color .15s,background .15s}
.stagecard b{font-size:18px}.stagecard small{font-size:13px;color:var(--muted)}
.stagecard[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft)}
.stagecard[aria-pressed=true] b{color:var(--acc)}
.wz-foot{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.wz-foot .btn{min-width:120px;min-height:48px;font-size:15px}

/* ---------- محرر المعادلات ---------- */
#eqdlg{border:0;padding:0;background:none;width:100%;max-width:100vw;max-height:94dvh;margin:auto auto 0}
#eqdlg::backdrop{background:oklch(0.3 0.03 262 / .4)}
.eq{background:var(--panel);border-radius:20px 20px 0 0;padding:14px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:94dvh;overflow:auto;animation:sheet .3s var(--e-out)}
.eq>*{flex-shrink:0}
@keyframes sheet{from{transform:translateY(20px);opacity:0}}

.eqfields{display:flex;flex-wrap:wrap;gap:8px}.eqfields .fld{flex:1 1 140px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.gt{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 4px 6px;min-height:86px}
.gt:hover{border-color:var(--acc-line);background:var(--acc-soft)}
.gt-v{font-family:'Noto Sans Arabic',sans-serif;font-size:16px;flex:1;display:flex;align-items:center}
.gt small{font-size:12px;font-weight:700;color:var(--ink2)}

.sy{min-height:42px;padding:0 4px;white-space:nowrap;overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-size:17px;font-family:'Noto Sans Arabic','Tinos',serif}
.sy:hover{background:var(--acc-soft);border-color:var(--acc-line)}
.eq footer{position:sticky;bottom:-12px;display:flex;gap:8px;background:var(--panel);padding-top:8px}
.eq footer .btn{flex:1;min-height:48px}
#toast{position:fixed;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));left:50%;translate:-50% 0;z-index:70;display:flex;align-items:center;gap:12px;background:oklch(0.3 0.03 262);color:oklch(0.98 0.003 262);padding:10px 10px 10px 18px;border-radius:12px;box-shadow:var(--sh-2);font-size:14px;font-weight:600;width:max-content;max-width:calc(100vw - 24px)}
#toast.in{animation:tin .3s var(--e-out)}#toast.out{animation:tout .18s cubic-bezier(0.7,0,0.84,0) forwards}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}@keyframes tout{to{opacity:0;transform:translateY(6px)}}
#toast button{border:0;background:oklch(0.4 0.03 262);color:inherit;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}

.welcome-section{padding:32px 0;border-color:oklch(.91 .006 260)}
.welcome h2{font-size:24px;margin-bottom:18px;color:oklch(.27 .016 260)}
.features{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:36px}
.feature{display:block;border:0;padding:16px 0}
.feature-number{display:none}
.feature h3{font-size:14px;font-weight:800;margin-bottom:6px}
.feature p{font-size:13px;color:oklch(.51 .01 260);line-height:1.9}
.learn-section{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px}
.learn-section p{font-size:14px;color:oklch(.51 .01 260);max-width:52ch}
.learn-steps li{font-size:13px;border-bottom:1px solid oklch(.94 .004 260)}
.learn-steps li:before{border:0;border-radius:0;background:none;color:#41628B;width:20px}
.welcome-footer{border-color:oklch(.91 .006 260);font-size:11px;line-height:1.9}
.file-panel{margin:24px 0;padding:24px;background:oklch(.95 .006 260);border:1px solid oklch(.87 .01 260);border-radius:6px}
.file-panel h2{font-size:20px;margin-bottom:10px}
.file-panel p{font-size:13px;line-height:1.9}
.file-panel input[type=file]{padding:10px;background:oklch(.995 .003 260);border:1px solid oklch(.84 .012 260);border-radius:4px;width:100%;max-width:540px;font-size:14px}
.file-panel input::file-selector-button{font-family:Cairo,sans-serif;background:#294B7C;color:oklch(.99 .004 260);border:0;border-radius:4px;padding:10px 16px;margin-inline-end:12px;cursor:pointer}
.file-error{color:var(--danger)}
@media(max-width:700px){
 .welcome{padding:20px 24px 40px}.welcome-nav{flex-wrap:nowrap;align-items:center}.welcome-brand{flex-basis:auto;font-size:18px}.welcome-brand small{font-size:10px}
 .welcome-nav .welcome-actions{flex-direction:column;align-items:flex-end;gap:4px}.welcome-nav .btn{font-size:11px;min-height:32px;padding:0 9px}
 .welcome-hero{grid-template-columns:1fr;gap:28px;padding:32px 0}.welcome h1{font-size:48px}.welcome h1 span{font-size:21px}.welcome .intro{font-size:14px;line-height:2}
 .welcome-hero .welcome-actions{display:grid;grid-template-columns:1fr 1fr}.welcome-hero .welcome-actions .primary{grid-column:1 / -1}.welcome-hero .btn{font-size:12px}
 .welcome-preview{margin:0;max-width:320px;width:100%;justify-self:center;padding:20px}.features{grid-template-columns:1fr 1fr;gap:0 24px}
 .welcome h2{font-size:21px}.learn-section{grid-template-columns:1fr;gap:12px}.file-panel{padding:16px}.lesson-bar{gap:6px}
}
@media(max-width:359px){.features{grid-template-columns:1fr}.welcome-brand small{white-space:normal}}
.item-r textarea{min-width:0}
.frow-b input,.frow-b textarea{min-width:0}
.qc-h{min-width:0}

.math-fast{border:1px solid var(--acc-line);border-radius:12px;padding:10px 11px;background:var(--acc-soft);display:grid;gap:7px}
.math-fast>b{font-size:13px;color:var(--acc)}
.math-fast-scroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;padding:1px 0 5px}
.math-fast-scroll button{border:1px solid var(--acc-line);background:var(--panel);border-radius:9px;padding:8px 11px;min-height:43px;white-space:nowrap;font-size:13px;font-weight:800;color:var(--ink)}
.eqfields select[data-eq]{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:14px;font-weight:700}
.eqprev .mx,.gt-v .mx{font-weight:800}

/* v18 — MathType-inspired structured mathematics palette; original offline engine */
#eqdlg{width:min(100%,960px);max-height:96dvh}
#eqdlg::backdrop{background:rgba(14,28,53,.66)}
#eqdlg .eq{gap:11px;max-height:96dvh;background:#f9fbff;border:1px solid #c5d2e6;box-shadow:0 30px 80px rgba(16,39,78,.25)}
#eqdlg .eq>header{background:#fff;border:1px solid #dae3f0;border-radius:12px;padding:9px 11px;flex-wrap:wrap;gap:10px}
#eqdlg .eq>header b{font-size:15px;color:#173A63}
#eqdlg .eq-preview-label{font-size:12px;font-weight:800;color:#486486;letter-spacing:.01em}
#eqdlg .eqprev{position:relative;min-height:112px;max-height:225px;background:#fff;border:2px solid #3a629a;box-shadow:inset 0 1px 8px rgba(24,58,99,.06);border-radius:11px;padding:20px 14px;overflow:auto;color:#101a2e}
#eqdlg .eqprev .mx{font-size:1.2em;font-weight:800}
#eqdlg .math-fast{background:#ecf1fa;border-color:#bed0e9;border-radius:11px;padding:10px}
#eqdlg .math-fast-scroll button{border-color:#c5d5e8;background:#fff;min-height:40px}
#eqdlg .eq-palette{background:#fff;border:1px solid #ccd8e9;border-radius:13px;overflow:hidden;min-height:188px}
#eqdlg .eq-palette-title{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 13px 8px;color:#173A63}
#eqdlg .eq-palette-title b{font-size:14px}
#eqdlg .eq-palette-title span{font-size:11px;color:#627993}
#eqdlg .eq-cat-tabs{display:flex;overflow-x:auto;gap:3px;padding:0 8px 7px;border-bottom:1px solid #d9e2f0;scrollbar-width:thin;scroll-snap-type:x proximity}
#eqdlg .eq-cat-tabs button{scroll-snap-align:start;flex:none;min-height:40px;padding:8px 13px;border:0;border-radius:9px;background:transparent;color:#435875;font-weight:800;font-size:12px;white-space:nowrap}
#eqdlg .eq-cat-tabs button[aria-selected=true]{background:#214a80;color:#fff}
#eqdlg .eq-cat-tabs button:focus-visible{outline:2px solid #214a80;outline-offset:2px}
#eqdlg .eq-template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px;padding:13px;max-height:255px;overflow:auto}
#eqdlg .eq-template-tile{min-height:100px;min-width:0;border:1px solid #d2def0;background:#fff;border-radius:11px;padding:10px 6px 8px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:6px;color:#1b3559;transition:border-color .12s,box-shadow .12s,transform .12s}
#eqdlg .eq-template-tile:hover,#eqdlg .eq-template-tile:focus-visible{border-color:#315e95;box-shadow:0 0 0 3px rgba(49,94,149,.1);background:#f7faff}
#eqdlg .eq-template-tile:active{transform:translateY(1px)}
#eqdlg .eq-tile-symbol{font-family:'STIX Two Math','Noto Sans Arabic',sans-serif;display:flex;flex:1;align-items:center;justify-content:center;max-width:100%;max-height:76px;overflow:auto;text-align:center;font-size:17px;font-weight:800}
#eqdlg .eq-tile-caption{color:#344c6c;font-size:12px;font-weight:800;text-align:center}
#eqdlg .eqform{background:#fff;border-color:#aabed9;border-radius:13px;gap:12px}
#eqdlg .eqform-h{border-bottom:1px solid #e5ebf3;padding-bottom:7px}
#eqdlg .eqform .fld>span,#eqdlg .eq-line label>span{font-size:12px;font-weight:800;color:#354b67}
#eqdlg .eq-matrix-fields{display:grid;grid-template-columns:repeat(var(--eq-cols,2),minmax(0,1fr));gap:8px;flex:1 0 100%;border:1px dashed #95afce;padding:12px;border-radius:10px;background:#f8fbff;min-width:0}
#eqdlg .eq-matrix-fields label{display:grid;gap:4px;min-width:0}
#eqdlg .eq-matrix-fields small{font-size:11px;color:#425d80}
#eqdlg .eq-matrix-fields input,#eqdlg .eq-multiline input{width:100%;min-width:0;padding:10px;border:1px solid #b6c8e0;border-radius:9px;background:#fff;color:#101828;font-family:'STIX Two Math','Noto Sans Arabic',serif;font-size:17px;font-weight:700}
#eqdlg .eq-multiline{display:grid;gap:8px;flex:1 0 100%;min-width:0}
#eqdlg .eq-line{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid #d8e3f1;border-radius:10px;background:#f8fbff;min-width:0}
#eqdlg .eq-line>b{background:#e7eef8;color:#183e71;border-radius:7px;padding:7px 9px;font-size:13px}
#eqdlg .eq-line label{display:grid;gap:5px;flex:1;min-width:0}
#eqdlg .eq-code{border:1px solid #d4deec;background:#fff;border-radius:10px;padding:9px 12px}
#eqdlg .eq-code summary{color:#28496f;font-size:12px;font-weight:800;cursor:pointer}
#eqdlg .eq-code label{display:grid;gap:6px;font-size:12px;font-weight:700;margin:9px 0}
#eqdlg .eq-code textarea{width:100%;border:1px solid #bacbe0;border-radius:8px;resize:vertical;min-height:65px;font-size:13px;padding:8px;font-family:monospace;text-align:left}
#eqdlg .eq-code small{display:block;margin:7px 0;font-size:11px;color:#576e89}
#eqdlg .eq footer{background:#f9fbff;border-top:1px solid #d6e0ec;z-index:2}
@media(max-width:639px){#eqdlg .eq{height:min(96dvh,940px);max-height:96dvh;padding:10px 10px calc(9px + env(safe-area-inset-bottom))}#eqdlg .eq-template-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-height:240px}#eqdlg .eq-palette-title{display:grid;gap:3px}#eqdlg .eq-preview-label{margin-top:2px}#eqdlg .eqprev{min-height:106px;font-size:21px;padding:14px 10px}#eqdlg .eq-line{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:start}#eqdlg .eq-line label:nth-of-type(2){grid-column:2}#eqdlg .eq-cat-tabs button{padding:7px 11px}}

#eqdlg .eq-symbol-tile span{font-size:11px;font-weight:750;color:#415a7c;text-align:center;line-height:1.35}
#eqdlg .eq-symbols-heading{padding:9px 13px 0;font-size:12px;color:#264b7b;font-weight:800}

@media(max-width:639px){#eqdlg .eq-palette-body{max-height:260px}#eqdlg .eq-direct-symbols{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}#eqdlg .eq-palette .eq-template-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}#eqdlg .eq-symbol-tile{min-height:68px}}

@media(max-width:639px){#eqdlg .eq-section-picker{display:grid;gap:5px;padding:10px 12px 0;color:#244771;font-weight:800;font-size:12px}#eqdlg .eq-category-picker{display:block;width:100%;min-height:46px;background:#f5f8fd;color:#173a63;border:1px solid #bfcfe5;border-radius:10px;padding:9px 13px;font-size:14px;font-family:inherit;font-weight:800}#eqdlg .eq-cat-tabs{display:none}}
